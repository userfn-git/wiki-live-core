name: WikiLife Core CI

on:
  push:
    branches:
      - main
      - 'PATH*-BR*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-and-test:
    name: Structural Integrity & Unit Tests (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify WikiLife Core Directory Structure
        run: |
          test -d src
          test -d docs
          test -d tests
          test -f models/Modelfile.yusra

      - name: Run Python Unit Tests (Zero-Dependency)
        run: |
          python -m unittest discover -s tests -v
