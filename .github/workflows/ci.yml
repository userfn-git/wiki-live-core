name: WikiLife Core Governance & Integrity CI
on:
  push:
    branches: [ main, "PATH*" ]
  pull_request:
    branches: [ main ]
jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Governance & Templates
        run: |
          test -f LICENSE
          test -f .github/SECURITY.md
          test -f .github/ISSUE_TEMPLATE/bug_report.yml
          echo "All WikiLife governance & template baselines verified."
